// ---------- helpers ----------
const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b),angTo=(a,b,c,d)=>Math.atan2(d-b,c-a);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
function wpick(o){let s=0;for(const k in o)s+=o[k];let r=Math.random()*s;for(const k in o){r-=o[k];if(r<=0)return k;}return Object.keys(o)[0];}
const fmt=n=>Math.round(n).toLocaleString('en-US');
function short(n){n=Math.max(0,n);if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return Math.round(n)+'';}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}
function tfmt(s){const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(1);}

// ---------- audio ----------
let AC=null,master,musicGain,sfxGain,noiseBuf,muted=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.32;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=0.6;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  if(mus.tr)mus.next=AC.currentTime+0.05;}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type,vol,o={}){if(!AC||muted)return;const w=o.when!=null?o.when:AC.currentTime+(o.at||0);
  const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,w);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),w+dur);
  g.gain.setValueAtTime(0.0001,w);g.gain.linearRampToValueAtTime(vol,w+0.006);g.gain.exponentialRampToValueAtTime(0.0001,w+dur);
  os.connect(g);g.connect(o.dest||sfxGain);os.start(w);os.stop(w+dur+0.02);}
function noiseB(dur,vol,freq,o={}){if(!AC||muted)return;const w=o.when!=null?o.when:AC.currentTime+(o.at||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,w);g.gain.exponentialRampToValueAtTime(0.0001,w+dur);
  s.connect(f);f.connect(g);g.connect(o.dest||sfxGain);s.start(w,Math.random()*0.5);s.stop(w+dur+0.02);}
const sfxLast={};
function thr(k,t){const n=performance.now();if(sfxLast[k]&&n-sfxLast[k]<t)return false;sfxLast[k]=n;return true;}

const mus={tr:null,step:0,next:0};
function setMusic(n){if(mus.tr===TR[n])return;mus.tr=TR[n];mus.step=0;if(AC)mus.next=AC.currentTime+0.08;}
function musicTick(){if(!AC||!mus.tr)return;if(muted){mus.next=AC.currentTime+0.05;return;}
  const t=mus.tr,sp=60/t.bpm/4;if(mus.next<AC.currentTime-0.2)mus.next=AC.currentTime+0.05;
  while(mus.next<AC.currentTime+0.15){schedNote(t,mus.step,mus.next,sp);mus.next+=sp;mus.step++;}}
function schedNote(t,step,w,sp){const s=step%16,bar=Math.floor(step/16)%t.prog.length,r=t.root+t.prog[bar],ct=t.major?MAJ:MIN,o={when:w,dest:musicGain};
  if(s%2===0)tone(mf(r-12+(s%8===6?7:0)),sp*1.8,'triangle',0.17,o);
  tone(mf(r+12+ct[t.arp[s%t.arp.length]]),sp*0.8,'square',0.03,o);
  const m=bar%2?t.mel[(s+8)%16]:t.mel[s];if(m>=0)tone(mf(r+24+ct[m]),sp*1.9,'triangle',0.05,o);
  if(t.drums){if(s%4===0)tone(150,0.12,'sine',0.25,{when:w,dest:musicGain,slide:42});
    if(t.drums>1?s%2===1:s%4===2)noiseB(0.03,0.05,7000,{when:w,dest:musicGain,ft:'highpass'});
    if(s===4||s===12)noiseB(0.12,0.09,1800,{when:w,dest:musicGain});}}

const OUT='#0a0710';
function sprite(rows,pal,s,flash){const w=Math.max(...rows.map(r=>r.length)),h=rows.length,g0=rows.map(r=>r.padEnd(w,'.'));
  const c=document.createElement('canvas');c.width=(w+2)*s;c.height=(h+2)*s;const g=c.getContext('2d');
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&g0[y][x]!=='.';
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
    if(op(x,y)){g.fillStyle=flash?'#ffffff':pal[g0[y][x]]||'#f0f';g.fillRect((x+1)*s,(y+1)*s,s,s);}
    else if(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)){g.fillStyle=flash?'#ffffff':OUT;g.fillRect((x+1)*s,(y+1)*s,s,s);}}
  return c;}

function buildFloor(th){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#07060b';g.fillRect(0,0,W,H);
  for(let y=AR.y;y<AR.y2;y+=32)for(let x=AR.x;x<AR.x2;x+=32){g.fillStyle=pick(th.floor);g.fillRect(x,y,32,32);
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x,y+31,32,1);g.fillRect(x+31,y,1,32);
    g.fillStyle='rgba(255,255,255,.03)';g.fillRect(x,y,32,1);
    if(Math.random()<.14){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x+ri(4,22),y+ri(4,24),ri(3,9),2);}
    if(Math.random()<.05){g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x+ri(6,20),y+ri(6,20),2,ri(4,10));}}
  const wt=14;g.fillStyle=th.wall;
  g.fillRect(AR.x-wt,AR.y-wt,AR.w+wt*2,wt);g.fillRect(AR.x-wt,AR.y2,AR.w+wt*2,wt);
  g.fillRect(AR.x-wt,AR.y-wt,wt,AR.h+wt*2);g.fillRect(AR.x2,AR.y-wt,wt,AR.h+wt*2);
  g.fillStyle=th.wall2;
  for(let x=AR.x-wt;x<AR.x2+wt;x+=24){g.fillRect(x,AR.y-wt,1,wt);g.fillRect(x+12,AR.y2,1,wt);}
  for(let y=AR.y-wt;y<AR.y2+wt;y+=24){g.fillRect(AR.x-wt,y,wt,1);g.fillRect(AR.x2,y+12,wt,1);}
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(AR.x,AR.y,AR.w,6);g.fillRect(AR.x,AR.y,6,AR.h);
  return c;}

const later=(t,fn)=>timers.push({t,fn});

function banner(text,color){banners.push({text,color:color||'#fff',t:3.2});if(banners.length>4)banners.shift();}

const CORNERS=[[70,110],[890,110],[70,480],[890,480]];

// ---------- damage ----------
function rollDmg(base){const crit=Math.random()<BASE.cc;return{v:base*(crit?1+BASE.cd:1)*rand(0.95,1.05),crit};}
function targets(){const t=[];for(const e of ents)if(e.alive&&!e.untargetable)t.push(e);for(const o of objs)if(o.hittable)t.push(o);return t;}
function hitEnemy(e,base,src){
  if(e.onHit)return e.onHit(base,src);
  if(!e.alive)return 0;
  const m=e.vuln(src);
  if(m<=0){if(e.immT<=0){addNum(e.x,e.y-e.r-12,'IMMUNE','#9aa4b0');e.immT=0.6;}return 0;}
  let{v,crit}=rollDmg(base);v*=m*(e.cracked>0?1.3:1);
  e.hp-=v;e.flash=0.07;run.dmg+=v;
  addNum(e.x+rand(-18,18),e.y-e.r-rand(0,22),fmt(v)+(crit?'!':''),crit?'#ffd23f':'#ffffff',crit);
  crit?sfx.crit():sfx.hit();
  if(e.hp<=0){e.hp=0;e.onDeath();}
  return v;}
function hurtPlayer(raw,o={}){
  if(state!=='play'||P.dead)return;
  if(P.invT>0)return;
  if(!o.tick&&P.iframes>0)return;
  let d=raw*100/(100+BASE.def)*rand(0.95,1.05);
  if(P.ward>0){const a=Math.min(P.ward,d);P.ward-=a;d-=a;if(a>0)addNum(P.x+12,P.y-26,'('+fmt(a)+')','#ffd86b');}
  P.hp-=d;if(!o.tick)P.iframes=0.45;P.flash=0.12;
  if(d>0)addNum(P.x+rand(-8,8),P.y-24,'-'+fmt(d),'#ff5a5a');
  shake(o.tick?1.5:5);sfx.hurt();
  if(o.kb){P.kb.x+=Math.cos(o.kb.a)*o.kb.f;P.kb.y+=Math.sin(o.kb.a)*o.kb.f;}
  if(P.hp<=0)playerDown(o.by||'the crypt');}
function playerDown(by){
  if(P.lastStand){P.lastStand=false;P.hp=1;P.invT=2;run.lastStands++;banner('LAST STAND! The Voidforged Aegis holds','#c79bff');sfx.wish();ringFx(P.x,P.y,90,'#c79bff',0.6);return;}
  if(!run.emberUsed){run.emberUsed=true;P.hp=P.maxHp;P.invT=3;banner('EMBERWING rises from the ashes. You are reborn!','#ff9a3c');sfx.wish();burst(P.x,P.y,'#ff9a3c',50,260);ringFx(P.x,P.y,140,'#ff9a3c',0.8);return;}
  P.hp=0;P.dead=true;run.deaths++;deathBy=by;state='dead';stateT=0;sfx.boom();}

function updHazards(dt){
  for(const h of hazards){
    switch(h.k){
    case'circle':h.t-=dt;if(h.t<=0){if(h.dmg&&dist(P.x,P.y,h.x,h.y)<h.r+P.r*0.5)hurtPlayer(h.dmg,{by:h.by});

    case'line':if(h.t>0){h.t-=dt;if(h.t<=0&&h.dmg)sfx.zap();}else{h.act-=dt;if(h.dmg&&!h.hit&&segDist(P.x,P.y,h.x1,h.y1,h.x2,h.y2)<h.w/2+P.r*0.6){hurtPlayer(h.dmg,{by:h.by});h.hit=true;}if(h.act<=0)h.dead=true;}break;
    case'ring':{h.r+=h.sp*dt;const d=dist(P.x,P.y,h.x,h.y);
      if(!h.hit&&Math.abs(d-h.r)<h.th/2+P.r*0.5){const a=angTo(h.x,h.y,P.x,P.y);
        if(!(h.gw>0&&Math.abs(angDiff(a,h.ga))<h.gw/2)){if(h.dmg)hurtPlayer(h.dmg,{by:h.by});if(h.push){P.kb.x+=Math.cos(a)*h.push;P.kb.y+=Math.sin(a)*h.push;}h.hit=true;}}
      if(h.r>1150)h.dead=true;break;}
    case'zone':if(h.t>0)h.t-=dt;else{h.dur-=dt;h.tick-=dt;if(h.tick<=0&&dist(P.x,P.y,h.x,h.y)<h.r){hurtPlayer(h.dps*0.25,{tick:true,by:h.by});h.tick=0.25;}
      if(Math.random()<0.3)parts.push({x:h.x+rand(-h.r,h.r)*0.7,y:h.y+rand(-h.r,h.r)*0.7,vx:0,vy:-40,t:0.5,T:0.5,color:h.color,size:3});if(h.dur<=0)h.dead=true;}break;

      else{h.a+=clamp(angDiff(h.a,angTo(o.x,o.y,P.x,P.y)),-0.75*dt,0.75*dt);h.dur-=dt;h.tick-=dt;
        const d=dist(o.x,o.y,P.x,P.y);if(h.tick<=0&&d<h.range&&Math.abs(angDiff(h.a,angTo(o.x,o.y,P.x,P.y)))<h.spread){hurtPlayer(h.dps*0.2,{tick:true,by:h.by});h.tick=0.2;}
        for(let i=0;i<4;i++){const a=h.a+rand(-h.spread,h.spread),s=rand(200,420);parts.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:h.range/s,T:h.range/s,color:pick(['#ff7a1a','#ffd23f','#ff4a1a']),size:ri(3,6)});}
        if(h.dur<=0)h.dead=true;}break;}
    case'sweep':{const o=h.owner;if(o){if(!o.alive||o.off){h.dead=true;break;}h.x=o.x;h.y=o.y;}
      if(h.t>0)h.t-=dt;else{h.a+=h.av*dt;h.dur-=dt;h.tick-=dt;const x2=h.x+Math.cos(h.a)*h.len,y2=h.y+Math.sin(h.a)*h.len;
        if(h.tick<=0&&segDist(P.x,P.y,h.x,h.y,x2,y2)<h.w/2+P.r*0.6){hurtPlayer(h.dps*0.2,{tick:true,by:h.by});h.tick=0.2;}if(h.dur<=0)h.dead=true;}break;}
    case'choir':h.t-=dt;if(h.t<=0){const safe=h.safes.some(s=>dist(P.x,P.y,s.x,s.y)<s.r);if(!safe)hurtPlayer(h.dmg,{by:h.by});
      flashScreen=0.5;sfx.thunder();for(let i=0;i<6;i++)bolt(rand(AR.x,AR.x2),AR.y-30,rand(AR.x,AR.x2),rand(AR.y,AR.y2));h.dead=true;}break;
    }}
  hazards=hazards.filter(h=>!h.dead);}

    later(0.5,()=>{if(!e.alive)return;const a=angTo(e.x,e.y,P.x,P.y);for(let k=-1;k<=1;k++)eShot(e.x,e.y,a+k*0.18,330,9,14000*e.pow,'#ffd23f',e.name);});sfx.flame();},
  pools(e){for(let k=0;k<5;k++){const x=k===0?P.x:rand(AR.x+60,AR.x2-60),y=k===0?P.y:rand(AR.y+60,AR.y2-60);hzZone(x,y,60,1.0,6,25000*e.pow,'#ff5a1a',e.name);}},
  rain(e){for(let k=0;k<8;k++){const x=k===0?P.x:rand(AR.x+40,AR.x2-40),y=k===0?P.y:rand(AR.y+40,AR.y2-40);hzCircle(x,y,48,1.15,20000*e.pow,'#e8c14a',e.name,'shard');}},

};
function moveToward(e,tx,ty,sp,dt){const a=angTo(e.x,e.y,tx,ty);e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;}
function aiUpdate(e,dt){
  e.flash-=dt;e.immT-=dt;e.cracked-=dt;
  if(e.stun>0){e.stun-=dt;return;}
  if(e.dash){const d=e.dash;e.x+=Math.cos(d.a)*d.sp*dt;e.y+=Math.sin(d.a)*d.sp*dt;e.x=clamp(e.x,AR.x+e.r,AR.x2-e.r);e.y=clamp(e.y,AR.y+e.r,AR.y2-e.r);
    if(Math.random()<0.6)parts.push({x:e.x,y:e.y,vx:0,vy:0,t:0.3,T:0.3,color:'#8d93a1',size:5});
    if(!d.hit&&dist(e.x,e.y,P.x,P.y)<e.r+P.r){hurtPlayer(26000*e.pow,{by:e.name,kb:{a:d.a,f:520}});d.hit=true;}
    d.t-=dt;if(d.t<=0)e.dash=null;return;}
  if(e.leap){const l=e.leap;l.t+=dt;const k=Math.min(1,l.t/l.T);e.x=l.sx+(l.tx-l.sx)*k;e.y=l.sy+(l.ty-l.sy)*k;e.z=Math.sin(k*Math.PI)*90;if(k>=1){e.leap=null;e.z=0;}return;}
  if(e.busy>0)e.busy-=dt;
  else{const d=dist(e.x,e.y,P.x,P.y);if(d>e.keep)moveToward(e,P.x,P.y,e.spd,dt);else if(d<e.keep*0.55)moveToward(e,P.x,P.y,-e.spd*0.5,dt);}
  e.atkT-=dt*e.rate;
  if(e.atkT<=0&&e.busy<=0){atk[wpick(e.atks)](e);e.atkT=rand(e.atkMin,e.atkMax);}
  if(e.contact&&dist(e.x,e.y,P.x,P.y)<e.r+P.r)hurtPlayer(e.contact*e.pow,{by:e.name,kb:{a:angTo(e.x,e.y,P.x,P.y),f:380}});
  e.x=clamp(e.x,AR.x+e.r,AR.x2-e.r);e.y=clamp(e.y,AR.y+e.r,AR.y2-e.r);}
function mkBoss(o){return Object.assign({x:480,y:180,r:30,alive:true,flash:0,immT:0,cracked:0,stun:0,rate:1,tele:1,pow:1,busy:0,atkT:2.2,atkMin:1.8,atkMax:2.6,
  spd:70,keep:150,z:0,isBoss:true,contact:0,atks:{},vuln(){return 1;},tag(){return null;},update(dt){aiUpdate(this,dt);},onDeath(){this.alive=false;phaseDone();}},o,{hp:o.maxHp});}
function spawnThrall(x,y){burst(x,y,'#d8d2c4',14);ents.push({name:'Bound Thrall',spr:'thrall',x,y,r:12,hp:4e6,maxHp:4e6,alive:true,flash:0,immT:0,cracked:0,stun:0,minion:true,z:0,
  speed:rand(85,108),tick:0,vuln(){return 1;},onDeath(){this.alive=false;burst(this.x,this.y,'#d8d2c4',16);},
  update(dt){this.flash-=dt;this.immT-=dt;this.cracked-=dt;if(this.stun>0){this.stun-=dt;return;}
    moveToward(this,P.x,P.y,this.speed,dt);
    for(const o of ents)if(o!==this&&o.minion&&o.alive){const d=dist(this.x,this.y,o.x,o.y);if(d<24&&d>0){this.x+=(this.x-o.x)/d*40*dt;this.y+=(this.y-o.y)/d*40*dt;}}
    if(dist(this.x,this.y,P.x,P.y)<this.r+P.r+2){this.tick-=dt;if(this.tick<=0){hurtPlayer(9000,{tick:true,by:'a Bound Thrall'});this.tick=0.6;}}}});}

// ---------- puzzles (Phase III consoles) ----------
const PZ={x:W/2-215,y:H/2-178,w:430,h:356};
const PZCOL=[['CRIMSON','#e0453a'],['AZURE','#3a8fe0'],['VERDANT','#4fc35a'],['AMBER','#e0a83a']];
function lightsToggle(z,i){const c=i%3,r=Math.floor(i/3);for(const[dc,dr]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const cc=c+dc,rr=r+dr;if(cc>=0&&cc<3&&rr>=0&&rr<3)z.vals[rr*3+cc]=!z.vals[rr*3+cc];}}
function mkPuzzle(kind){const z={kind,err:0,good:0};
  if(kind==='order'){z.vals=shuffle([...Array(12)].map((_,i)=>i+1));z.next=1;z.cols=4;z.rows=3;z.title='Click the runes in order, 1 to 12';}
  if(kind==='color'){z.tc=ri(0,3);z.cols=5;z.rows=3;do{z.vals=[...Array(15)].map(()=>ri(0,3));}while(z.vals.filter(v=>v===z.tc).length<4);z.sel=z.vals.map(()=>false);z.title='Select every '+PZCOL[z.tc][0]+' tile';}
  if(kind==='lights'){z.cols=3;z.rows=3;z.vals=Array(9).fill(true);do{for(let i=0;i<5;i++)lightsToggle(z,ri(0,8));}while(z.vals.every(v=>v));z.title='Light every lamp (each click flips a cross)';}
  if(kind==='memory'){z.cols=3;z.rows=3;z.seq=[...Array(5)].map(()=>ri(0,8));z.title='Watch the pattern, then repeat it';z.mode='show';z.si=0;z.st=0.5;z.lit=-1;z.inp=0;z.flashI=-1;z.flashT=0;}
  if(kind==='dials'){z.cols=5;z.rows=1;z.vals=[...Array(5)].map(()=>ri(1,3));z.title='Turn every dial to point upward';}

  if(e.isBoss&&e.spr==='vessk'&&e.warded){circ(e.x,e.y-z,e.r+18+Math.sin(t*5)*2,'rgba(200,205,220,.10)','rgba(220,225,235,.65)',2);}
  if(e.spr==='ysolde'&&!(e.grounded>0)&&Math.random()<0.15)bolt(e.x+rand(-26,26),e.y-20,e.x+rand(-36,36),e.y+rand(-10,30),'#9fe8ff');
  if(e.echo){circ(e.x,e.y+bob-z,e.r+10,'rgba(123,75,192,.18)');}
  if(e.spr==='orrin'&&Math.random()<0.5)parts.push({x:e.x+rand(-14,14),y:e.y-24-z,vx:rand(-10,10),vy:rand(-80,-40),t:0.4,T:0.4,color:pick(['#ff7a1a','#ffd23f']),size:3});
  if(e.spr==='king'&&Math.random()<0.4)parts.push({x:e.x+rand(-30,30),y:e.y+rand(0,30),vx:0,vy:rand(-40,-10),t:0.8,T:0.8,color:'#7b4bc0',size:3});
  const off=e.off;
  drawSprite(e.spr,e.x,e.y+bob-z,e.flash>0,e.spr!=='king'&&P.x<e.x,off?0.55:e.echo?0.72:1);
  if(e.cracked>0&&!off){X.strokeStyle='rgba(201,162,122,.8)';X.lineWidth=2;line(e.x-10,e.y-e.r-z,e.x-2,e.y-e.r+8-z);line(e.x-2,e.y-e.r+8-z,e.x+6,e.y-e.r+2-z);}
  if(e.stun>0){for(let i=0;i<3;i++){const a=t*4+i*TAU/3;rect(e.x+Math.cos(a)*20-2,e.y-e.r-14+Math.sin(a)*5-z,4,4,'#ffd23f');}}
  if(e.minion){bar(e.x-14,e.y-22,28,5,e.hp/e.maxHp,'#e0453a');}}

function drawPlayer(){const t=performance.now()/1000;if(P.invT>0&&Math.floor(t*20)%2)return;
  circ(P.x,P.y+14,11,'rgba(0,0,0,.4)');
  const flip=Math.cos(P.aim)<0,bob=Math.abs(Math.sin(P.walk))*2;
  const hx=P.x+Math.cos(P.aim)*12,hy=P.y+4+Math.sin(P.aim)*8;
  let wa=P.aim;if(P.swing>0&&(P.weapon===0||P.weapon===3)){const k=P.swing/0.16;wa=P.swingA+(k-0.5)*2.2;}
  if(Math.sin(P.aim)<0)drawWeapon(P.weapon,hx,hy,wa,1);
  drawSprite('player',P.x,P.y-bob,P.flash>0,flip);
  if(Math.sin(P.aim)>=0)drawWeapon(P.weapon,hx,hy,wa,1);

  if(P.potT>0&&Math.random()<0.3)parts.push({x:P.x+rand(-10,10),y:P.y+10,vx:0,vy:-50,t:0.5,T:0.5,color:'#6dff8a',size:3});}

function drawHazard(h){const t=performance.now()/1000;
  switch(h.k){
  case'circle':{const k=1-h.t/h.T;circ(h.x,h.y,h.r,alpha(h.color,0.12),alpha(h.color,0.8),2);circ(h.x,h.y,h.r*k,alpha(h.color,0.28));break;}
  case'line':{X.save();X.translate(h.x1,h.y1);X.rotate(Math.atan2(h.y2-h.y1,h.x2-h.x1));const L=Math.hypot(h.x2-h.x1,h.y2-h.y1);
    if(h.t>0){const k=1-h.t/h.T;rect(0,-h.w/2,L,h.w,alpha(h.color,0.1+0.15*k));X.strokeStyle=alpha(h.color,0.6);X.lineWidth=1;X.strokeRect(0,-h.w/2,L,h.w);rect(0,-1,L*k,2,alpha(h.color,0.8));}
    else if(h.dmg){rect(0,-h.w/2,L,h.w,'rgba(255,255,255,.85)');rect(0,-h.w/2+3,L,h.w-6,h.color);}X.restore();break;}
  case'ring':{X.strokeStyle=h.color;X.lineWidth=h.th;X.beginPath();if(h.gw>0)X.arc(h.x,h.y,h.r,h.ga+h.gw/2,h.ga-h.gw/2+TAU);else X.arc(h.x,h.y,h.r,0,TAU);X.stroke();
    if(h.dmg){X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=2;X.beginPath();if(h.gw>0)X.arc(h.x,h.y,h.r,h.ga+h.gw/2,h.ga-h.gw/2+TAU);else X.arc(h.x,h.y,h.r,0,TAU);X.stroke();}break;}
  case'zone':if(h.t>0){circ(h.x,h.y,h.r,alpha(h.color,0.1),alpha(h.color,0.7),2);circ(h.x,h.y,h.r*(1-h.t/h.T),alpha(h.color,0.2));}
    else{circ(h.x,h.y,h.r,alpha(h.color,0.38+0.08*Math.sin(t*10)),'#ffd23f',2);}break;
  case'cone':{X.beginPath();X.moveTo(h.x,h.y);X.arc(h.x,h.y,h.range,h.a-h.spread,h.a+h.spread);X.closePath();
    if(h.t>0){X.fillStyle='rgba(255,122,26,.12)';X.fill();X.strokeStyle='rgba(255,122,26,.7)';X.lineWidth=2;X.stroke();}else{X.fillStyle='rgba(255,122,26,.28)';X.fill();}break;}
  case'sweep':{const x2=h.x+Math.cos(h.a)*h.len,y2=h.y+Math.sin(h.a)*h.len;
    if(h.t>0){X.strokeStyle=alpha(h.color,0.25+0.3*(1-h.t/h.T));X.lineWidth=h.w;line(h.x,h.y,x2,y2);X.strokeStyle=alpha(h.color,0.8);X.lineWidth=1;line(h.x,h.y,x2,y2);}
    else{X.strokeStyle=alpha(h.color,0.55);X.lineWidth=h.w+8;line(h.x,h.y,x2,y2);X.strokeStyle=h.color;X.lineWidth=h.w;line(h.x,h.y,x2,y2);X.strokeStyle='#fff';X.lineWidth=h.w*0.35;line(h.x,h.y,x2,y2);}break;}
  case'choir':{const k=1-h.t/h.T;rect(AR.x,AR.y,AR.w,AR.h,'rgba(30,60,140,'+(0.1+0.3*k)+')');
    for(const s of h.safes){circ(s.x,s.y,s.r,'rgba(160,230,255,'+(0.18+0.1*Math.sin(t*8))+')','#bff0ff',3);txt('SAFE',s.x,s.y,20,'#e8faff','center');}
    txt('STORM CHOIR  '+h.t.toFixed(1),480,AR.y+24,26,'#bff0ff','center');break;}}}

function drawPuzzle(){const z=P.console.pz;rect(0,0,W,H,'rgba(0,0,0,.35)');frame(PZ.x,PZ.y,PZ.w,PZ.h,'rgba(20,17,12,.97)','#b8892e');

    if(z.kind==='order'){const v=z.vals[i];bg=v<z.next?'#2f7a3a':'#4f4633';lab=v<z.next?'':String(v);if(v===z.next)bg='#6a5a30';}

      X.strokeStyle=z.vals[i]===0?'#7dff6a':'#e0453a';X.lineWidth=5;line(cx,cy,cx+Math.cos(a)*22,cy+Math.sin(a)*22);circ(cx,cy,4,'#e8e0d0');}

function draw(){X.imageSmoothingEnabled=false;
  if(state==='title'){drawTitle();return;}
  if(state==='loadout'){drawLoadout();return;}
  if(state==='victory'){drawVictory();return;}
  drawWorld();drawHUD();
  if(state==='intro')drawIntro();
  if(state==='paused'){rect(0,0,W,H,'rgba(0,0,0,.6)');txt('PAUSED',W/2,H/2-20,64,'#fff','center');txt('P / Esc to resume  ·  M toggles sound',W/2,H/2+30,22,'#9f96b8','center');}
  if(state==='clear'){rect(0,H/2-60,W,120,'rgba(0,0,0,.6)');txt(phaseIdx===4?'THE HOLLOW KING FALLS':'PHASE CLEARED',W/2,H/2-14,56,'#e8c14a','center');txt(PHASES[phaseIdx].title+'   '+tfmt(run.splits[phaseIdx]||0),W/2,H/2+30,24,'#c9b8ff','center');}
  if(state==='dead'){rect(0,0,W,H,'rgba(40,0,0,.7)');txt('YOU DIED',W/2,H/2-40,80,'#ff4a4a','center');txt('Slain by '+deathBy,W/2,H/2+14,26,'#f0c0c0','center');
    if(stateT>0.8)txt('R  retry this phase      T  title screen',W/2,H/2+60,24,'#fff','center');}}

// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;
  try{update(dt);draw();}catch(err){console.error(err);}
  pressed={};clicks.length=0;mouse.rPressed=false;requestAnimationFrame(loop);}
resetPlayer();requestAnimationFrame(loop);
